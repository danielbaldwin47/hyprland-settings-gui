name: CI

# The done checks on main and on a pull request out of draft. An effort branch
# (docs/agents/implement-spec.md) is checked once when its PR leaves draft, then
# on each push after that, so a green check means everything on the PR has been
# addressed. The Harness tier runs nightly and on dispatch only (the `harness` job).
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  # The draft flag is in the key: a push to a draft and the `ready_for_review` run that
  # follows on the same SHA must not cancel each other. The schedule flag keeps the
  # nightly run and a push to main from cancelling each other.
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Skip ceiling for the pytest jobs: equals today's intentional data-driven
  # skips in the ui-smoke job's `tests/ui tests/unit`, 13: 10 corpus rices
  # without binds (test_writer_binds_corpus), 2 parametrized doc-skips
  # (test_no_hyprctl_spawn), and one #70 test that runs the real `Hyprland`
  # binary, which no runner has. `tests/static` runs only under `meson test`,
  # which has no ceiling, so its skips never count here. A missing
  # dependency skips tests silently -- lua5.4's absence once skipped 72 tests
  # while the job stayed green -- so any count above this fails the job.
  # The PR that adds or removes an intentional skip moves this number with it.
  SKIP_CEILING: '13'

jobs:
  lint:
    name: ruff + mypy (engine)
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff mypy
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy (engine only)
        run: mypy

  unit:
    name: unit tier (engine, headless)
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest pytest-xdist
      # `luac` is the Writer's syntax gate (ADR-0010). It is not a runtime
      # dependency -- the gate degrades to a no-op without it -- so this job
      # installs it deliberately: a skipped gate would let a Module that does
      # not parse go green, which is the one thing the gate exists to stop.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4
      # No GTK installed on this runner at all, so the gi-mask seam test is
      # checked against a machine where gi genuinely does not exist as well as
      # against the masked one in the ui-smoke job below.
      - env:
          HYPRTWEAKER_REQUIRE_LUAC: '1'
          # This job runs `tests/unit` only. Its own intentional skips are 12
          # (10 corpus rices without binds in test_writer_binds_corpus, 2
          # parametrized doc-skips in test_no_hyprctl_spawn), plus 2
          # module-level `importorskip`s for gi (test_ui_binds_text,
          # test_ui_declaration_text) which this runner lacks: 14, and the
          # ceiling sits one above them. Their tests run for real in the ui-smoke job, where
          # gi exists. test_ui_rules_text has none: it imports only gi-free
          # names (`ui/pages/entity_text.py`, #220).
          SKIP_CEILING: '14'
        run: |
          set -o pipefail
          pytest tests/unit -n auto -v 2>&1 | tee pytest-out.log
          test -s pytest-out.log
          SKIPPED=$(grep -oE '[0-9]+ skipped' pytest-out.log | tail -1 | grep -oE '[0-9]+' || echo 0)
          echo "skipped: $SKIPPED (ceiling $SKIP_CEILING)"
          [ "$SKIPPED" -le "$SKIP_CEILING" ] || { echo "::error::$SKIPPED tests skipped, above the ceiling of $SKIP_CEILING -- a dependency is probably missing"; exit 1; }

  ui-smoke:
    name: UI smoke tier (GTK4 + libadwaita)
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Pinned, not ubuntu-latest: the app needs libadwaita >= 1.7 (Adw.WrapBox,
    # MINIMUM_LIBADWAITA) and PyGObject >= 3.50; noble (24.04) ships 1.5 and 3.48.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 / libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 \
            libgtk-4-1 libadwaita-1-0 xvfb dbus lua5.4
      - name: Create venv with system gi visible
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install pytest pytest-xdist
      - name: Boot the app headless
        env:
          # This job installed GTK on purpose, so a skipped UI tier here means
          # the install regressed -- fail instead of going green on zero tests.
          HYPRTWEAKER_REQUIRE_UI: '1'
        # tests/unit runs here too: this is the only runner where gi genuinely
        # imports, so it is the only place the seam test's mask is proven to be
        # doing work rather than passing because gi was absent anyway.
        # Same skip ceiling: the UI tier itself must contribute zero skips
        # (HYPRTWEAKER_REQUIRE_UI hard-fails a dead GTK env).
        # No xvfb-run: the UI tier starts an Xvfb of its own in each worker
        # and a dbus-daemon (tests/ui/conftest.py), the same path a developer's desktop
        # run takes.
        run: |
          set -o pipefail
          .venv/bin/python -m pytest tests/ui tests/unit -n auto -v 2>&1 | tee pytest-out.log
          test -s pytest-out.log
          SKIPPED=$(grep -oE '[0-9]+ skipped' pytest-out.log | tail -1 | grep -oE '[0-9]+' || echo 0)
          echo "skipped: $SKIPPED (ceiling $SKIP_CEILING)"
          [ "$SKIPPED" -le "$SKIP_CEILING" ] || { echo "::error::$SKIPPED tests skipped, above the ceiling of $SKIP_CEILING -- a dependency is probably missing"; exit 1; }

  build:
    name: meson build + install
    if: github.event_name != 'schedule' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # Pinned, not ubuntu-latest: meson.build refuses PyGObject < 3.50 (`import gi.events`),
    # and noble (24.04) ships python3-gi 3.48. resolute (26.04) ships 3.56.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        # desktop-file-utils and appstream: `meson test` validates the desktop entry and
        # the metainfo, and -Dtests=enabled requires both validators.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            libgtk-4-1 libadwaita-1-0 lua5.4 desktop-file-utils appstream
          apt-cache policy python3-gi
      # Deliberately no actions/setup-python here: this job must use the system
      # python3 that apt's python3-gi belongs to, so `meson setup`'s gi check and
      # the installed launcher both exercise the interpreter a package would use.
      # apt (not pip) for pytest for the same reason, and it sidesteps PEP 668.
      - run: sudo apt-get install -y --no-install-recommends python3-pytest
      # -Dtests=enabled makes pytest required at configure time, so `meson test`
      # can never pass by having found no tests to run.
      - run: meson setup build --prefix=/usr -Dtests=enabled
      - run: meson compile -C build
      - name: meson test
        # Exercises the wiring a PKGBUILD check() will use (ADR-0019). The UI
        # tier skips here: the runner image ships Xvfb, so the host-display
        # opt-in points the tier at this job's display, which it has none of.
        # Run serially under apt's pytest it would make this the slowest job,
        # and the ui-smoke job already runs it.
        # No skip ceiling here: this job wraps the same suites the two pytest
        # jobs already guard, and its UI-tier skip is intentional.
        env:
          HYPRTWEAKER_UI_HOST_DISPLAY: '1'
        run: meson test -C build --print-errorlogs
      - run: DESTDIR="$PWD/_install" meson install -C build
      - name: The installed launcher runs, and the install is complete
        run: |
          test -x _install/usr/bin/hyprtweaker
          # The App id's desktop entry, metainfo and icons (ADR-0019).
          APP_ID=io.github.danielbaldwin47.Hyprtweaker
          for file in applications/$APP_ID.desktop metainfo/$APP_ID.metainfo.xml \
              icons/hicolor/scalable/apps/$APP_ID.svg \
              icons/hicolor/symbolic/apps/$APP_ID-symbolic.svg; do
            test -f "_install/usr/share/$file" || { echo "not installed: $file"; exit 1; }
          done
          # Locate the install by finding it, not by predicting it: Debian puts
          # it in dist-packages while sysconfig reports site-packages, so every
          # formula for this path is wrong on some distro.
          PKG_INIT="$(find _install -path '*/hyprtweaker/__init__.py' | head -1)"
          test -n "$PKG_INIT" || { echo "package was not installed"; exit 1; }
          export PYTHONPATH="$(dirname "$(dirname "$PKG_INIT")")"
          echo "installed package dir: $PYTHONPATH"
          _install/usr/bin/hyprtweaker --help
          # Import every installed module, so a source missing from
          # src/meson.build's lists fails here as well as in the unit tier.
          python3 - <<'PY'
          import importlib, pkgutil
          import hyprtweaker
          names = [m.name for m in pkgutil.walk_packages(
              hyprtweaker.__path__, prefix="hyprtweaker.")]
          assert names, "installed package exposes no modules"
          for name in names:
              importlib.import_module(name)
          print(f"imported {len(names)} installed modules")
          PY
      - name: The Schema loads from the install prefix, not just from a checkout
        # `schema_dir()` finds the checkout copy first, so every schema test would pass
        # even with the data install completely broken. Running against the installed
        # tree from an unrelated directory is the only way that shows up.
        run: |
          # Absolute, because the `cd` below would strand a relative PYTHONPATH.
          PKG_INIT="$(find "$PWD/_install" -path '*/hyprtweaker/__init__.py' | head -1)"
          export PYTHONPATH="$(dirname "$(dirname "$PKG_INIT")")"
          export XDG_DATA_DIRS="$PWD/_install/usr/share"
          cd /tmp
          python3 - <<'PY'
          from hyprtweaker.engine.schema import load_schema, schema_dir
          print(f"schema dir: {schema_dir()}")
          schema = load_schema()
          assert len(schema) > 300, f"only {len(schema)} options in the installed schema"
          for option in schema:
              assert option.title and option.widget and option.visibility
          print(f"resolved {len(schema)} options for Hyprland {schema.hyprland_version}")
          PY

  harness:
    # ADR-0011 tier 3: the nested Hyprland, on a stock runner. Nightly and on dispatch only,
    # never per push: it is minutes long and gates nothing. A runner has no GPU, so the
    # Harness gets the kernel's virtual KMS card (`vkms`) with its connector forced off, the
    # one render-node-less card `drm_card_problem` accepts. Ubuntu has no Hyprland, so the
    # tier runs in an Arch container, as an unprivileged user: Hyprland refuses root.
    name: Harness tier (nested Hyprland on vkms)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: A vkms card with its connector forced off
        id: card
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" >/dev/null
          sudo modprobe vkms
          sudo udevadm settle
          # Read the card from sysfs: its number depends on what else the runner has.
          card=""
          for path in /sys/class/drm/card*; do
            name="${path##*/}"
            [[ "$name" =~ ^card[0-9]+$ ]] || continue
            device="$(readlink -f "$path/device")"
            echo "$name: device $device, driver $(readlink -f "$path/device/driver" || true)"
            if [ "${device##*/}" = vkms ]; then card="$name"; fi
          done
          [ -n "$card" ] || { echo "::error::modprobe vkms gave no vkms card"; exit 1; }
          # A connected connector is a monitor to the gate, which refuses the card.
          for status in /sys/class/drm/"$card"-*/status; do
            echo off | sudo tee "$status" >/dev/null
            echo "$status: $(cat "$status")"
          done
          sudo chmod 666 "/dev/dri/$card"
          # bwrap needs an unprivileged user namespace, which Ubuntu's AppArmor withholds.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "card=$card" >> "$GITHUB_OUTPUT"
      - name: The Harness tier in an Arch container
        env:
          HARNESS_DRM_CARD: /dev/dri/${{ steps.card.outputs.card }}
        run: |
          docker run --rm --privileged -v /dev:/dev -v /sys:/sys -v "$PWD:/repo" -w /repo \
            -e HARNESS_DRM_CARD -e CI archlinux:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed hyprland grim bubblewrap mesa ttf-dejavu \
                python python-pytest python-gobject gtk4 python-numpy python-pillow \
                >/tmp/pacman.log || { tail -40 /tmp/pacman.log; exit 1; }
              pacman -Q hyprland mesa python
              useradd -m harness
              install -d -m 700 -o harness /tmp/xdg-harness
              # HYPRTWEAKER_REQUIRE_HARNESS: a skipped tier fails the job, never goes green.
              runuser -u harness -- env XDG_RUNTIME_DIR=/tmp/xdg-harness \
                HARNESS_DRM_CARD="$HARNESS_DRM_CARD" CI="$CI" HYPRTWEAKER_REQUIRE_HARNESS=1 \
                PYTHONDONTWRITEBYTECODE=1 \
                python -m pytest tests/integration -p no:cacheprovider -v -rs'
