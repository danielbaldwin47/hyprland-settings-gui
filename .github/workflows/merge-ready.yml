name: Ready to merge

# Red until the PR is out of draft and carries the `ready-to-merge` label,
# which the orchestrator adds once the work is finished and reviewed
# (docs/agents/implement-spec.md, step 8). The owner merges only PRs
# where this is green. The repo's plan has no required checks, so on the
# merge box the red is a warning, not a lock.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions: {}

concurrency:
  group: merge-ready-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ready-to-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Require the ready-to-merge label on a PR out of draft
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'ready-to-merge') }}
        run: |
          if [ "$DRAFT" = "true" ]; then
            echo "::error::Draft PR: still in progress."
            exit 1
          fi
          if [ "$LABELLED" != "true" ]; then
            echo "::error::No ready-to-merge label: the orchestrator adds it once the work is finished and reviewed."
            exit 1
          fi
          echo "Marked ready to merge."
