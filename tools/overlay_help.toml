# What each setting's Row says (#129).
#
# One `["<setting>"]` entry per setting, with exactly one of:
#   help = "..."   replaces the upstream line in the Row subtitle, the Help popover and the
#                  search text: what the setting does, then when you would change it. At
#                  most 160 characters and two sentences, ending with a period.
#   skip = "..."   why the upstream line stands as it is.
# Say "setting", "Hyprland", "this version"; never "option", "schema" or "wiki". Do not list
# values the combo already names, and do not restate restart needs (the restart pill does).
# The rules are code: tools/overlay_help.py, run by tests/unit/test_overlay_help.py.
#
# After editing, write the `help` entries into data/schema/overlay.json:
#     .venv/bin/python tools/curate_overlay.py
# The comment above each entry is generated: tools/seed_overlay_help.py rewrites it and
# keeps your decisions. Never edit `help` in overlay.json by hand.


# --- general -----------------------------------------------------------------------------------

# general:border_size: Border size [Borders] (int, default 1)
#   upstream: size of the border around windows
#   wiki:     size of the border around windows
#   candidate: short (33 chars)
["general:border_size"]
help = "Width of the border around every window, in pixels. Set it to 0 to remove borders."

# general:gaps_in: Inner gaps [Layout and gaps] (css_gaps, default '5 5 5 5')
#   upstream: gaps between windows
#   wiki:     gaps between windows
#   candidate: short (20 chars)
["general:gaps_in"]
help = "Space between neighbouring windows, in pixels. One number applies to every side; four give top, right, bottom and left."

# general:gaps_out: Outer gaps [Layout and gaps] (css_gaps, default '20 20 20 20')
#   upstream: gaps between windows and monitor edges
#   wiki:     gaps between windows and monitor edges
#   candidate: short (38 chars)
["general:gaps_out"]
help = "Space between windows and the screen edges, in pixels. One number applies to every side; four give top, right, bottom and left."

# general:float_gaps: Floating window gaps [Layout and gaps] (css_gaps, default '0 0 0 0')
#   upstream: gaps between windows and monitor edges for floating windows
#   wiki:     gaps between windows and monitor edges for floating windows `-1` means default
#   candidate: wiki is longer (78 chars)
["general:float_gaps"]
help = "Space between floating windows and the screen edges, in pixels. Leave it unset to use the outer gaps."

# general:gaps_workspaces: Workspace gaps [Layout and gaps] (int, default 0)
#   upstream: gaps between workspaces. Stacks with gaps_out.
#   wiki:     gaps between workspaces. Stacks with gaps_out.
["general:gaps_workspaces"]
help = "Space between workspaces, in pixels. It adds to the outer gaps."

# general:col.inactive_border: Inactive border colour [Borders] (gradient, default 'ff444444 0deg')
#   upstream: border color for inactive windows
#   wiki:     border color for inactive windows
#   candidate: short (33 chars)
["general:col.inactive_border"]
help = "Border colour of windows without focus. Use one colour, or several with an angle for a gradient."

# general:col.active_border: Active border colour [Borders] (gradient, default 'ffffffff 0deg')
#   upstream: border color for the active window
#   wiki:     border color for the active window
#   candidate: short (34 chars)
["general:col.active_border"]
help = "Border colour of the window with focus. Use one colour, or several with an angle for a gradient."

# general:col.nogroup_border: Ungrouped border colour [Borders] (gradient, default 'ffffaaff 0deg')
#   upstream: inactive border color for window that cannot be added to a group
#   wiki:     inactive border color for window that cannot be added to a group (see `hl.dsp.window.deny_from_group` dispatcher)
#   candidate: wiki is longer (113 chars)
["general:col.nogroup_border"]
help = "Border colour of a window without focus that cannot be added to a group."

# general:col.nogroup_border_active: Active ungrouped border colour [Borders] (gradient, default 'ffff00ff 0deg')
#   upstream: active border color for window that cannot be added to a group
#   wiki:     active border color for window that cannot be added to a group
["general:col.nogroup_border_active"]
help = "Border colour of the window with focus when it cannot be added to a group."

# general:layout: Layout [Layout and gaps] (string, default 'dwindle')
#   upstream: which layout to use. [dwindle/master/scrolling/monocle/lua:<name>]
#   wiki:     which layout to use. \[`"dwindle"`/`"master"`/`"scrolling"`/`"monocle"`\]
#   the combo already names its values (labels)
#   candidate: lists values the combo shows: dwindle, master, scrolling, monocle
["general:layout"]
help = "Which tiling layout to use. Custom Lua layouts are selectable as lua:<name>."

# general:no_focus_fallback: Never refocus after closing a window [Behaviour] (bool, default False)
#   upstream: if true, will not fall back to the next available window when moving focus in a direction where no window was found
#   wiki:     if true, will not fall back to the next available window when moving focus in a direction where no window was found
["general:no_focus_fallback"]
help = "Stops focus from jumping to another window when you move it in a direction that has no window."

# general:resize_on_border: Resize windows by dragging their border [Resizing] (bool, default False)
#   upstream: enables resizing windows by clicking and dragging on borders and gaps
#   wiki:     enables resizing windows by clicking and dragging on borders and gaps
["general:resize_on_border"]
help = "Lets you resize a window by dragging its border, or the gaps around it, with the mouse."

# general:extend_border_grab_area: Border grab area [Resizing] (int, default 15)
#   upstream: extends the area around the border where you can click and drag on, only used when general:resize_on_border is on.
#   wiki:     extends the area around the border where you can click and drag on, only used when `general.resize_on_border` is on.
["general:extend_border_grab_area"]
help = "How far outside a border, in pixels, you can still grab it to resize. Applies only when resizing by border is on."

# general:hover_icon_on_border: Show the resize cursor on borders [Resizing] (bool, default True)
#   upstream: show a cursor icon when hovering over borders, only used when general:resize_on_border is on.
#   wiki:     show a cursor icon when hovering over borders, only used when `general.resize_on_border` is on.
["general:hover_icon_on_border"]
help = "Shows a resize cursor when the pointer is over a border. Applies only when resizing by border is on."

# general:allow_tearing: Allow tearing [Behaviour] (bool, default False)
#   upstream: master switch for allowing tearing to occur.
#   wiki:     master switch for allowing tearing to occur. See [the Tearing page](../../Advanced-and-Cool/Tearing).
#   candidate: wiki is longer (101 chars)
["general:allow_tearing"]
help = "Master switch for screen tearing, which lowers input lag in games. A window also needs the immediate window rule to tear."

# general:resize_corner: Resize corner [Resizing] (int, default 0)
#   upstream: force floating windows to use a specific corner when being resized (1-4 going clockwise from top left, 0 to disable)
#   wiki:     force floating windows to use a specific corner when being resized (1-4 going clockwise from top left, 0 to disable)
#   the combo already names its values (map)
["general:resize_corner"]
help = "Makes floating windows always resize from one corner, instead of the one nearest the pointer."

# general:snap:enabled: Snap floating windows [Snapping] (bool, default False)
#   upstream: enable snapping for floating windows
#   wiki:     enable snapping for floating windows
#   candidate: short (36 chars)
["general:snap:enabled"]
help = "Makes a floating window you drag line up with nearby windows and screen edges."

# general:snap:window_gap: Snap distance to windows [Snapping] (int, default 10)
#   upstream: minimum gap in pixels between windows before snapping
#   wiki:     minimum gap in pixels between windows before snapping
["general:snap:window_gap"]
help = "How close, in pixels, a dragged window must come to another window before it snaps to it."

# general:snap:monitor_gap: Snap distance to monitor edges [Snapping] (int, default 10)
#   upstream: minimum gap in pixels between window and monitor edges before snapping
#   wiki:     minimum gap in pixels between window and monitor edges before snapping
["general:snap:monitor_gap"]
help = "How close, in pixels, a dragged window must come to a screen edge before it snaps to it."

# general:snap:border_overlap: Overlap borders when snapping [Snapping] (bool, default False)
#   upstream: if true, windows snap such that only one border's worth of space is between them
#   wiki:     if true, windows snap such that only one border's worth of space is between them
["general:snap:border_overlap"]
help = "Lets snapped windows sit with only one border's width between them, so their borders overlap."

# general:snap:respect_gaps: Respect gaps when snapping [Snapping] (bool, default False)
#   upstream: if true, snapping will respect gaps between windows
#   wiki:     if true, snapping will respect gaps between windows(set in general:gaps_in)
#   candidate: wiki is longer (75 chars)
["general:snap:respect_gaps"]
help = "Keeps the inner gap between snapped windows instead of letting them touch."

# general:modal_parent_blocking: Block interaction with modal parents [Behaviour] (bool, default True)
#   upstream: if true, parent windows of modals will not be interactive.
#   wiki:     whether parent windows of modals will be interactive
["general:modal_parent_blocking"]
help = "Blocks clicks and typing in a window while one of its modal dialogs is open."

# general:locale: Locale [Behaviour] (string, default '')
#   upstream: overrides the system locale
#   wiki:     overrides the system locale (e.g. `"en_US"`, `"es"`)
#   candidate: short (27 chars); wiki is longer (52 chars)
["general:locale"]
help = "Overrides the system language Hyprland uses, such as en_US or es. Leave it empty to follow the system."


