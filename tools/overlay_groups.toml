# The curated Groups of each Section's Page, in display order (#157, #158).
#
# One `[[<section>]]` row per Group: `title`, an optional one-sentence `description`, and
# `options`, its member settings in display order. Every setting of a curated Section sits
# in exactly one row. The conventions a row follows (size, titles, descriptions, order) are
# in the docstring of tests/unit/test_overlay_completeness.py.
#
# After editing, write the rows into data/schema/overlay.json:
#     .venv/bin/python tools/curate_overlay.py
# Never edit `group` or `order` in overlay.json by hand: tests/unit/test_curate_overlay.py
# fails while the two disagree.

# --- general ---------------------------------------------------------------------------------

