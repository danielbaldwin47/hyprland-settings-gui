# Python tooling only. meson is the canonical build (ADR-0011) -- there is
# deliberately no [build-system] or [project] table here, so there is exactly
# one way to build and install the app.

[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/corpus"]  # third-party rice fixtures, not our code

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.mypy]
# The Engine, plus every module above it that never imports `gi` (`session.py` and the
# gi-free UI modules that decide rather than draw). ADR-0011 exempts the rest of the UI
# because PyGObject stubs are perpetually partial and the layer is `gi`-dynamic -- neither
# is true of toolkit-free code, and `session.py` in particular is where the model, the
# writer and the socket meet. A new gi-free UI module joins this list and the ADR's;
# `tests/unit/test_mypy_census.py` fails until it does.
files = [
    "src/hyprtweaker/engine",
    "src/hyprtweaker/session.py",
    "src/hyprtweaker/ui/pages/plan.py",
    "src/hyprtweaker/ui/pages/tasks.py",
    "src/hyprtweaker/ui/pages/declaration_kinds.py",
    "src/hyprtweaker/ui/rows/gesture.py",
    "src/hyprtweaker/ui/rows/state.py",
    "src/hyprtweaker/ui/search.py",
]
mypy_path = "src"
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
# The per-commit tiers (ADR-0011 tiers 1, 2 and 4: unit, static, ui). `tests/integration`
# (tier 3) is deliberately absent: it is the Harness tier, run on demand and nightly in CI
# (the `harness` job), and needs a nested compositor.
#
# `tests/static` is `Hyprland --verify-config` over the writer's output -- no compositor,
# well under a second, and it skips itself where no Hyprland binary exists. It belongs here
# rather than behind `-m hyprland` because the developer machine that *can* run it is
# exactly the one that should.
testpaths = ["tests/unit", "tests/static", "tests/ui"]
pythonpath = ["src"]
markers = [
    "hyprland: integration tier; needs a real Hyprland binary (auto-skipped without one)",
]
