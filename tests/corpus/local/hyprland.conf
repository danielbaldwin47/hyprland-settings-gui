##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

xwayland {
	force_zero_scaling = true
}

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}


render {
  direct_scanout = true
  }

windowrule = immediate 1, match:class ^(steam_app_\d+)$
windowrule = no_blur 1, match:class ^(steam_app_\d+)$
windowrule = no_shadow 1, match:class ^(steam_app_\d+)$

# HyprMod managed settings
source = ~/.config/hypr/hyprland-gui.conf

# Shell Switcher - Auto-generated source
source = ~/.config/hypr/shell-switcher-startup.conf

# Shell Switcher - Auto-generated source
source = ~/.config/hypr/shell-switcher-binds.conf

source = ~/.config/hypr/noctalia/noctalia-colors.conf


source = ./dms/cursor.conf

# Ghibli shell theme (remove this line to revert the look)
source = ~/.config/hypr/ghibli-theme.conf

# Allow grim screenshots without a prompt (applies after a full Hyprland restart)
permission = /usr/(bin|local/bin)/grim, screencopy, allow

# forest-shell
source = ~/repos/forest-shell/integration/hyprland/forest-binds.conf
source = ~/repos/forest-shell/integration/hyprland/forest-rules.conf
