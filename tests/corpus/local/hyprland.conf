

###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$config = $HOME/.config
# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = rofi -show run
bind = SUPER, Q, exec, $terminal
#source = ~/.config/hypr/monitor.conf
#source = ~/.config/hypr/input.conf
source = ~/.config/hypr/keybinds.conf


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox
#exec-once = waybar
#exec-once = swww-daemon
#exec-once = hyprctl setcursor Posy_Cursor_Black_125_175 24
#exec-once = nm-applet
#exec-once = swaync


    # Enables the internal swipe engine
    workspace_swipe = true
    
    # Force the default workspace swipe to 4 fingers so it 
    # doesn't interfere with your 3-finger layout binds
    workspace_swipe_fingers = 4 


# =======================================================
# 4-Finger Vertical Swipe: Workspace Changing
# =======================================================
# This maps a 4-finger vertical movement to the native 
# workspace action, giving you true 1:1 kinetic scrolling.
gesture = 4, vertical, workspace

# =======================================================
# 3-Finger Horizontal Swipe: Scrolling Layout
# =======================================================
# Swiping left pushes the view right (next column)
gesture = 3, left, dispatcher, layoutmsg, move +col

# Swiping right pushes the view left (previous column)
gesture = 3, right, dispatcher, layoutmsg, move -col

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = STEAM_FORCE_DESKTOPUI_SCALING,2.5
env = GDK_SCALE,1

# Toolkit Backend Variables
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = NVD_BACKEND,direct



