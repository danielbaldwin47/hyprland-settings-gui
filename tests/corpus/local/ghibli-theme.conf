# ─── Ghibli shell · Hyprland theme ──────────────────────────────────
# Warm ink borders, soft paper shadows, gentle organic motion.
# Sourced at the end of hyprland.conf so it wins over earlier sections.
# To revert: remove the `source = ~/.config/hypr/ghibli-theme.conf`
# line from hyprland.conf (your old values live untouched above it).

general {
    border_size = 2
    col.active_border = rgba(6a5740ee) rgba(7ba153ee) 45deg
    col.inactive_border = rgba(d9c8a866)
    gaps_in = 6
    gaps_out = 12
}

decoration {
    rounding = 12

    shadow {
        enabled = true
        range = 16
        render_power = 3
        sharp = false
        offset = 0 4
        color = rgba(43342230)
        color_inactive = rgba(4334221a)
    }

    blur {
        enabled = no
    }
}

animations {
    enabled = yes

    bezier = ghibliEase, 0.25, 0.8, 0.25, 1
    bezier = ghibliSettle, 0.22, 1.1, 0.3, 1

    animation = windows, 1, 4.5, ghibliSettle, popin 94%
    animation = windowsOut, 1, 3.5, ghibliEase, popin 96%
    animation = windowsMove, 1, 4.5, ghibliEase, slide
    animation = workspaces, 1, 5, ghibliEase, slidefade 14%
    animation = layers, 1, 4, ghibliSettle, slide
    animation = fade, 1, 5, ghibliEase
}
