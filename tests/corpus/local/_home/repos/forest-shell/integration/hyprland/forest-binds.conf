# forest-shell — Hyprland keybinds (#57)
#
# Source this from ~/.config/hypr/hyprland.conf:
#
#     source = ~/repos/forest-shell/integration/hyprland/forest-binds.conf
#
# This file is *not* the one shell-switch manages. shell-switch regenerates
# ~/.config/hypr/shell-switcher-binds.conf wholesale on every switch, and it
# owns exactly one bind — SUPER+Space, the launcher. Anything written there is
# lost at the next switch, which is why the rest of the shell's binds live here
# instead, under version control.
#
# ## The fallback idiom
#
# Every bind below is
#
#     qs -p ~/repos/forest-shell/shell.qml ipc call <target> <fn> || <fallback>
#
# `qs ... ipc call` exits 255 when no instance is running (measured: "No running
# instances for ~/repos/forest-shell/shell.qml"), so `||` fires
# exactly when the shell is down. The point is the acceptance criterion: with
# the shell dead, the keys still do something and the compositor stays usable,
# rather than every shell key becoming silently inert while the user is trying
# to fix it.
#
# The `-p <path>` form rather than `-c <name>`: the #13 assembly refinements
# closed that decision as direct-path launch with no config-dir symlink. The
# path is what `pgrep`/`pkill` match on, so it must stay identical to
# FOREST_PROCESS_PATTERN in integration/shell-switch/registration.env — `~`
# expands before exec, so the two agree once Hyprland has run it.
#
# SUPER+Space is the one exception and it is *not* in this file. shell-switch
# interpolates `launcher_cmd` with `sed -e "s|{{LAUNCHER_CMD}}|…|g"`, so a `|`
# anywhere in that value breaks the sed expression — the launcher bind cannot
# have a fallback at all. tools/register-shell-switch.sh enforces that, and
# tools/binds-harness.sh checks it.
#
# ## What the fallbacks are, and are not
#
# Only three of these degrade to something that does the job: lock falls through
# to logind, screenshot to grim. The rest fall through to a notification, on
# purpose — the alternative for the session menu would be a bare
# `hyprctl dispatch exit`, and a power menu whose degraded form is "log out
# immediately, no prompt" is worse than one that says it is unavailable. Logout
# already has its own bind (SUPER+M in keybinds.conf) that does not go through
# the shell.
#
# ## Chords
#
# All of these are SUPER+SHIFT+<key>, chosen against ~/.config/hypr/keybinds.conf
# as of #57 — that file uses SUPER+SHIFT only for workspace moves (1-9, 0) and
# SUPER+SHIFT+S for hyprshot. Nothing here collides. Two notes:
#
#   - screenshot is on P, not the conventional S, because S is hyprshot's.
#   - keybinds.conf still binds CTRL+ALT+Q to hyprlock and SUPER+N to
#     swaync-client, neither of which is installed. Those are dead keys, not
#     collisions; retiring them is the user's call, not this file's.

# Lock. Falls through to logind, which locks the session for real — the handler
# that actually blanks is whatever the session has, but the session is locked.
bind = SUPER SHIFT, L, exec, qs -p ~/repos/forest-shell/shell.qml ipc call lock lock || loginctl lock-session

# Session / power menu. No safe degraded form — see above.
bind = SUPER SHIFT, Q, exec, qs -p ~/repos/forest-shell/shell.qml ipc call session toggle || notify-send "forest-shell" "session menu unavailable — the shell is not running"

# Notification centre.
bind = SUPER SHIFT, N, exec, qs -p ~/repos/forest-shell/shell.qml ipc call notificationcenter toggle || notify-send "forest-shell" "notification centre unavailable — the shell is not running"

# Settings window.
bind = SUPER SHIFT, comma, exec, qs -p ~/repos/forest-shell/shell.qml ipc call settings toggle || notify-send "forest-shell" "settings unavailable — the shell is not running"

# Screenshot. The shell's picker is a region selector; the fallback is a plain
# full-screen grab, because slurp is not installed and grim alone cannot select.
bind = SUPER SHIFT, P, exec, qs -p ~/repos/forest-shell/shell.qml ipc call screenshot open || sh -c 'mkdir -p ~/Pictures/screenshots && grim ~/Pictures/screenshots/$(date +%Y%m%d-%H%M%S).png'

# Screen recorder.
bind = SUPER SHIFT, R, exec, qs -p ~/repos/forest-shell/shell.qml ipc call recorder toggle || notify-send "forest-shell" "recorder unavailable — the shell is not running"

# Keep-awake / idle inhibit.
bind = SUPER SHIFT, K, exec, qs -p ~/repos/forest-shell/shell.qml ipc call keepawake toggle || notify-send "forest-shell" "keep-awake unavailable — the shell is not running"

# Bar hide/show (#70). `reveal` and `hide` are the one-way doors on the same
# target; `toggle` flips whatever is on screen and hands control back to the
# settings once it can, so a fullscreen window still hides the bar afterwards.
#
# It is `reveal` and not `show` on purpose: `qs ipc call bar show` is parsed by
# the client as its own `show` subcommand, which prints the target listing and
# exits 0 without calling anything (#77). A bind written that way looks like it
# works — nothing errors — and never moves the bar.
#
# The shell also registers a global shortcut for this, which costs no `qs`
# subprocess per press:
#
#   bind = SUPER SHIFT, B, global, forest-shell:bar-toggle
#
# It is not the default because a `global` dispatch has nothing to fall through
# to when the shell is not running. Pick one — binding both to B gives Hyprland
# two handlers for one key.
bind = SUPER SHIFT, B, exec, qs -p ~/repos/forest-shell/shell.qml ipc call bar toggle || notify-send "forest-shell" "bar toggle unavailable — the shell is not running"

# The calendar (#calendar). `toggle` and not `open`, because the key is the way
# in and the way out — and it is not `show`: `qs ipc call calendar show` is
# parsed by the client as its own `show` subcommand, prints the target listing
# and exits 0 without calling anything (#77).
bind = SUPER SHIFT, C, exec, qs -p ~/repos/forest-shell/shell.qml ipc call calendar toggle || notify-send "forest-shell" "calendar unavailable — the shell is not running"
