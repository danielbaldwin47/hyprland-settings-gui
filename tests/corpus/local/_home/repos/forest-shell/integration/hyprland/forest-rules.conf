# Window rules for forest-shell's toplevel surfaces (Hyprland >= 0.53 block
# syntax). The calendar is a FloatingWindow, not a layer surface (#187: an
# exclusive layer eats the pointer), so without a rule Hyprland tiles it and
# the 1180x760 layout gets squashed into whatever slot the tiler has free.
#
#   source = ~/repos/forest-shell/integration/hyprland/forest-rules.conf

windowrule {
    name = forest-shell-calendar
    match:class = ^org\.quickshell$
    match:title = ^forest-shell — calendar$

    float = true
    size = 1180 760
    center = true
}
