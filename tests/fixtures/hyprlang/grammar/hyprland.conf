# Synthetic grammar fixture: every hyprlang construct of research #4 section 1, including
# the edges no rice in tests/corpus exercises. Parsed with a fixed environment so the
# golden cannot move with the machine that runs it.

$mainMod = SUPER
$mainModAlt = $mainMod ALT
$gap = 5
$doubled = {{ gap * 2 }}
$thirds = {{ 1 / 3 }}
$rounding = {{ 0.1 + 0.2 }}
$escapedExpr = literal \{{ gap * 2 }}

# Longest name wins on a prefix collision, and no delimiter is needed.
$col = ff
$colour = 00ff99
$both = $colourAND$col

general {
    border_size = $gap
    gaps_in = {{ gap + 1 }}
    gaps_out = $doubled
    col.active_border = rgba(33ccffee) rgba($colouree) 45deg
    snap {
        enabled = true
    }
}

# Inline addressing is the same key as the nested form above.
general:snap:window_gap = 10
decoration:blur:enabled = true

# Handlers match on the left-hand side alone, so they fire inside a category too, and a
# `source =` inside one leaves the category open across the file boundary.
input {
    kb_layout = us
    bind = $mainMod, T, exec, inside-a-category
    source = scoped/kb.conf
}

# The first `=` splits; later ones stay in the value.
bind = $mainMod, equal, exec, echo a=b=c
bind = $mainModAlt, Q, exec, kitty

# The three allowFlags handlers carry their flag letters on the left-hand side.
bindle = , XF86AudioRaiseVolume, exec, volume up
bindm = $mainMod, mouse:272, movewindow
envd = XCURSOR_SIZE,24
gesture = 3, horizontal, workspace

# `##` escapes to one literal `#`; a bare `#` truncates.
misc:background_color = 0xff111111 ## not a comment
misc:vfr = true # this half is dropped

windowrule = float, class:^(pavucontrol)$
layerrule = blur, waybar

# The pre-0.54 rule spellings still parse, and Hyprland 0.56.2 refuses them outright.
windowrulev2 = float, class:^(legacy)$
layerrulev2 = blur, legacy

# An expression that is not `A op B` is a line error, and the text is left intact.
misc:broken_expression = {{ 1 ^ 2 }}

# An endif with nothing open.
# hyprlang endif

# A trailing backslash joins the next physical line verbatim.
exec-once = long-command \
    --with-a-flag \
    --and-another

# A line with an `=` is never a category open, even ending in `{`.
misc:disable_hyprland_logo = true {

# Keyed special category, block form.
device {
    name = epic-mouse-v1
    sensitivity = -0.5
    accel_profile = flat
}

# The key must be the block's first field: an error, but the block is still carried.
device {
    sensitivity = 0.1
    name = late-key-mouse
}

# Inline keyed form -- the spelling `hyprctl keyword` uses.
device[another-mouse]:sensitivity = 0.3

monitorv2 {
    output = DP-1
    mode = 2560x1440@144
}

# `plugin` is static, not keyed, and nests one level.
plugin {
    hyprbars {
        bar_height = 20
    }
}
plugin:hyprexpo:columns = 3

# Directives. MY_FLAG is set in the test environment, so the first branch is taken and
# the second is not; both are reported as baked in.
# hyprlang if MY_FLAG
misc:vrr = 1
# hyprlang endif
# hyprlang if !MY_FLAG
misc:vrr = 2
# hyprlang endif

# noerror suppresses the error record, not the parse.
# hyprlang noerror true
source = ./does-not-exist.conf
# hyprlang noerror false

# Malformed lines. Every one of these is preserved in the stream.
this line has no equals sign and no brace
= empty left hand side
}

# Only \{ \} \\ are unescaped, on the right-hand side only.
misc:font_family = Escaped \{braces\} and a \\ backslash

# An undefined variable stays literal text.
misc:splash_font_family = $NOT_DEFINED

# A bare key outside any category: hyprlang never applies it.
workspace_swipe = true

source = parts/*.conf
source = nested/entry.conf
